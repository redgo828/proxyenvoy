version: "3.9"

services:
  envoy:
    image: envoyproxy/envoy:v1.30-latest
    ports:
      - "8080:8080"
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml
      - ./jwks.json:/etc/envoy/jwks.json
      - ./proto.pb:/etc/envoy/proto.pb
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    depends_on:
      - backend
    networks:
      - mesh

  backend:
    build: ./backend
    ports:
      - "50051:50051"
    networks:
      - mesh

networks:
  mesh:
    driver: bridge
